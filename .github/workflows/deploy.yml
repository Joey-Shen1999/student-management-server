name: Deploy Test to AWS Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_HOST: ${{ vars.AWS_HOST }}
      AWS_USER: ${{ vars.AWS_USER }}
      AWS_PORT: ${{ vars.AWS_PORT }}
      AWS_HOST_KEY_FINGERPRINT: ${{ vars.AWS_HOST_KEY_FINGERPRINT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Spring Boot jar
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B package -DskipTests
          mkdir -p dist
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' -print -quit)"
          test -n "$jar_file"
          cp "$jar_file" dist/student-management-server-latest.jar

      - name: Configure SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in AWS_HOST AWS_USER AWS_PORT AWS_HOST_KEY_FINGERPRINT DEPLOY_PATH SERVICE_NAME AWS_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing deployment setting: $name"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -t ed25519 -p "$AWS_PORT" "$AWS_HOST" 2>/dev/null > ~/.ssh/known_hosts
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          test "$actual" = "$AWS_HOST_KEY_FINGERPRINT" || { echo 'SSH host key fingerprint mismatch'; exit 1; }

      - name: Upload and activate jar
        run: |
          set -euo pipefail
          ssh -p "$AWS_PORT" "$AWS_USER@$AWS_HOST" "mkdir -p '$DEPLOY_PATH/releases'"
          rsync -az -e "ssh -p $AWS_PORT" \
            dist/student-management-server-latest.jar \
            "$AWS_USER@$AWS_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA.jar.upload"
          ssh -p "$AWS_PORT" "$AWS_USER@$AWS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$SERVICE_NAME" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          service_name="$2"
          revision="$3"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          cd "$deploy_path"
          mv "releases/$revision.jar.upload" "releases/$revision.jar"
          previous="$(readlink student-management-server-latest.jar || true)"
          ln -s "releases/$revision.jar" student-management-server-latest.jar.next
          mv -Tf student-management-server-latest.jar.next student-management-server-latest.jar
          sudo systemctl restart "$service_name"
          for attempt in $(seq 1 60); do
            if systemctl is-active --quiet "$service_name" && \
               curl --silent --show-error --fail --max-time 3 \
                 http://127.0.0.1:8080/api/universities >/dev/null 2>&1; then
              echo "Backend deployment healthy: $revision"
              exit 0
            fi
            sleep 2
          done
          if [ -n "$previous" ]; then
            ln -s "$previous" student-management-server-latest.jar.next
            mv -Tf student-management-server-latest.jar.next student-management-server-latest.jar
            sudo systemctl restart "$service_name"
          fi
          echo 'Backend deployment did not become healthy'
          exit 1
          REMOTE
