name: Deploy to AWS Ubuntu

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_HOST: ${{ vars.AWS_HOST }}
      AWS_USER: ${{ vars.AWS_USER }}
      AWS_PORT: ${{ vars.AWS_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Missing vars.AWS_HOST}"
          : "${AWS_USER:?Missing vars.AWS_USER}"
          : "${DEPLOY_PATH:?Missing vars.DEPLOY_PATH}"
          : "${SERVICE_NAME:?Missing vars.SERVICE_NAME}"

      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${AWS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$AWS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on remote server
        run: |
          set -euo pipefail
          PORT="${AWS_PORT:-22}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AWS_USER@$AWS_HOST" \
            bash -s -- \
            "$DEPLOY_PATH" \
            "$SERVICE_NAME" \
            "${DB_CONTAINER_NAME:-}" \
            "${DB_HOST:-}" \
            "${DB_PORT:-}" \
            "${DB_NAME:-}" \
            "${DB_USER:-}" \
            "${DB_PASSWORD:-}" <<'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="$1"
          SERVICE_NAME="$2"
          DB_CONTAINER_NAME="${3:-}"
          DB_HOST="${4:-}"
          DB_PORT="${5:-}"
          DB_NAME="${6:-}"
          DB_USER="${7:-}"
          DB_PASSWORD="${8:-}"

          cd "$DEPLOY_PATH"
          git fetch --all --prune
          git reset --hard origin/main
          git clean -fd

          MIGRATION_FILES=(
            "scripts/migrations/20260318_teacher_student_ownership_deprecation.sql"
            "scripts/migrations/20260323_add_student_profile_teacher_note.sql"
            "scripts/migrations/20260327_add_performance_indexes.sql"
          )

          DB_CONTAINER_NAME="${DB_CONTAINER_NAME:-uni_apply_db}"
          DB_HOST="${DB_HOST:-localhost}"
          DB_PORT="${DB_PORT:-5432}"
          DB_NAME="${DB_NAME:-uni_apply}"
          DB_USER="${DB_USER:-postgres}"
          DB_PASSWORD="${DB_PASSWORD:-postgres}"

          run_migration() {
            local migration_file="$1"
            local migration_tmp="/tmp/$(basename "$migration_file")"
            if command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER_NAME"; then
              echo "Running DB migration via Docker container: $migration_file"
              docker cp "$migration_file" "$DB_CONTAINER_NAME:$migration_tmp"
              docker exec \
                -e PGPASSWORD="$DB_PASSWORD" \
                "$DB_CONTAINER_NAME" \
                psql -U "$DB_USER" -d "$DB_NAME" -f "$migration_tmp"
            elif command -v psql >/dev/null 2>&1; then
              echo "Running DB migration via local psql client: $migration_file"
              PGPASSWORD="$DB_PASSWORD" \
                psql \
                  -h "$DB_HOST" \
                  -p "$DB_PORT" \
                  -U "$DB_USER" \
                  -d "$DB_NAME" \
                  -f "$migration_file"
            else
              echo "No migration runner available (neither Docker DB container nor psql client found)."
              exit 1
            fi
          }

          for migration_file in "${MIGRATION_FILES[@]}"; do
            if [ ! -f "$migration_file" ]; then
              echo "Migration file not found: $migration_file"
              exit 1
            fi
            run_migration "$migration_file"
          done

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi

          JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name 'original-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$JAR_PATH" ]; then
            echo "No runnable jar found under target/"
            exit 1
          fi

          ln -sfn "$(basename "$JAR_PATH")" target/student-management-server-latest.jar

          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl status "$SERVICE_NAME" --no-pager
          REMOTE_SCRIPT
