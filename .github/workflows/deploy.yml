name: Deploy to AWS Ubuntu

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_HOST: ${{ vars.AWS_HOST }}
      AWS_USER: ${{ vars.AWS_USER }}
      AWS_PORT: ${{ vars.AWS_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_MAIL_USERNAME: ${{ vars.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
      APP_INFO_TASK_EMAIL_REMINDERS_ENABLED: ${{ vars.APP_INFO_TASK_EMAIL_REMINDERS_ENABLED }}
      APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED: ${{ vars.APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Missing vars.AWS_HOST}"
          : "${AWS_USER:?Missing vars.AWS_USER}"
          : "${DEPLOY_PATH:?Missing vars.DEPLOY_PATH}"
          : "${SERVICE_NAME:?Missing vars.SERVICE_NAME}"

      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${AWS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$AWS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on remote server
        run: |
          set -euo pipefail
          PORT="${AWS_PORT:-22}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AWS_USER@$AWS_HOST" \
            bash -s -- \
            "$DEPLOY_PATH" \
            "$SERVICE_NAME" \
            "${DB_CONTAINER_NAME:-}" \
            "${DB_HOST:-}" \
            "${DB_PORT:-}" \
            "${DB_NAME:-}" \
            "${DB_USER:-}" \
            "${DB_PASSWORD:-}" \
            "${SPRING_MAIL_USERNAME:-}" \
            "${SPRING_MAIL_PASSWORD:-}" \
            "${APP_MAIL_FROM:-}" \
            "${APP_INFO_TASK_EMAIL_REMINDERS_ENABLED:-}" \
            "${APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED:-}" <<'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="$1"
          SERVICE_NAME="$2"
          DB_CONTAINER_NAME="${3:-}"
          DB_HOST="${4:-}"
          DB_PORT="${5:-}"
          DB_NAME="${6:-}"
          DB_USER="${7:-}"
          DB_PASSWORD="${8:-}"
          SPRING_MAIL_USERNAME="${9:-}"
          SPRING_MAIL_PASSWORD="${10:-}"
          APP_MAIL_FROM="${11:-}"
          APP_INFO_TASK_EMAIL_REMINDERS_ENABLED="${12:-}"
          APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED="${13:-}"

          cd "$DEPLOY_PATH"
          git fetch --all --prune
          git reset --hard origin/main
          git clean -fd

          if [ -n "$SPRING_MAIL_PASSWORD" ]; then
            mkdir -p config
            umask 077
            SPRING_MAIL_PASSWORD_COMPACT="$(printf '%s' "$SPRING_MAIL_PASSWORD" | tr -d '[:space:]')"
            {
              printf 'spring.mail.username=%s\n' "${SPRING_MAIL_USERNAME:-noreply@global-vip.ca}"
              printf 'spring.mail.password=%s\n' "$SPRING_MAIL_PASSWORD_COMPACT"
              printf 'app.mail.from=%s\n' "${APP_MAIL_FROM:-noreply@global-vip.ca}"
              printf 'app.info-task.email-reminders.enabled=%s\n' "${APP_INFO_TASK_EMAIL_REMINDERS_ENABLED:-true}"
              printf 'app.task-tracking.email-reminders.enabled=%s\n' "${APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED:-true}"
            } > config/local-secrets.properties
          else
            echo "SPRING_MAIL_PASSWORD secret is not configured; keeping any existing server mail secrets file."
          fi

          PRECHECK_FILE="scripts/ops/preflight_release_20260330.sql"

          MIGRATION_FILES=(
            "scripts/migrations/20260318_teacher_student_ownership_deprecation.sql"
            "scripts/migrations/20260323_add_student_profile_teacher_note.sql"
            "scripts/migrations/20260327_add_performance_indexes.sql"
          )

          DB_CONTAINER_NAME="${DB_CONTAINER_NAME:-uni_apply_db}"
          DB_HOST="${DB_HOST:-localhost}"
          DB_PORT="${DB_PORT:-5432}"
          DB_NAME="${DB_NAME:-uni_apply}"
          DB_USER="${DB_USER:-postgres}"
          DB_PASSWORD="${DB_PASSWORD:-postgres}"

          run_sql_file() {
            local sql_file="$1"
            local sql_mode="$2"
            local sql_tmp="/tmp/$(basename "$sql_file")"
            if command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER_NAME"; then
              echo "Running DB $sql_mode via Docker container: $sql_file"
              docker cp "$sql_file" "$DB_CONTAINER_NAME:$sql_tmp"
              docker exec \
                -e PGPASSWORD="$DB_PASSWORD" \
                "$DB_CONTAINER_NAME" \
                psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" -f "$sql_tmp"
            elif command -v psql >/dev/null 2>&1; then
              echo "Running DB $sql_mode via local psql client: $sql_file"
              PGPASSWORD="$DB_PASSWORD" \
                psql \
                  -v ON_ERROR_STOP=1 \
                  -h "$DB_HOST" \
                  -p "$DB_PORT" \
                  -U "$DB_USER" \
                  -d "$DB_NAME" \
                  -f "$sql_file"
            else
              echo "No migration runner available (neither Docker DB container nor psql client found)."
              exit 1
            fi
          }

          if [ ! -f "$PRECHECK_FILE" ]; then
            echo "Preflight file not found: $PRECHECK_FILE"
            exit 1
          fi
          run_sql_file "$PRECHECK_FILE" "preflight"

          for migration_file in "${MIGRATION_FILES[@]}"; do
            if [ ! -f "$migration_file" ]; then
              echo "Migration file not found: $migration_file"
              exit 1
            fi
            run_sql_file "$migration_file" "migration"
          done

          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi

          JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name 'original-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$JAR_PATH" ]; then
            echo "No runnable jar found under target/"
            exit 1
          fi

          ln -sfn "$(basename "$JAR_PATH")" target/student-management-server-latest.jar

          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl status "$SERVICE_NAME" --no-pager
          REMOTE_SCRIPT
