# Production safety overrides
# Runtime-only production settings must be supplied by systemd EnvironmentFile
# or an external /home/ubuntu/student-management-server/application-prod.properties.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Keep schema changes under Flyway control only.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
