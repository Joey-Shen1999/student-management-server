spring.application.name=student-management-server
spring.config.import=optional:file:./config/local-secrets.properties

# ---- PostgreSQL datasource ----
spring.datasource.url=jdbc:postgresql://localhost:5432/uni_apply
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- CORS ----
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173

# ---- Auth session ----
app.auth.session-hours=12
app.student-invite.ttl-hours=72

# ---- SMTP email ----
# global-vip.ca currently uses Google Workspace MX records, so smtp.gmail.com is
# the likely SMTP submission host. If the mailbox moves to Microsoft 365 or
# another provider, override SPRING_MAIL_HOST and SPRING_MAIL_PORT accordingly.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@global-vip.ca}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:noreply@global-vip.ca}
app.notifications.test-recipients=${APP_TEST_EMAIL_RECIPIENTS:shenchupeng0807@gmail.com,joey.shen@globalielts.org,yong.chen@global-vip.ca}
app.info-task.email-reminders.enabled=${APP_INFO_TASK_EMAIL_REMINDERS_ENABLED:false}
app.task-tracking.email-reminders.enabled=${APP_TASK_TRACKING_EMAIL_REMINDERS_ENABLED:false}

# ---- Upload limits ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=120MB
server.tomcat.max-swallow-size=-1
