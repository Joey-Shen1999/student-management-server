spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
app.auth.session-hours=12
app.student-profile.transcript-dir=target/test-uploads/student-school-transcripts
app.student-profile.identity-file-dir=target/test-uploads/student-identity-files
app.student-documents.file-dir=target/test-uploads/student-documents
app.info-task.attachments.file-dir=target/test-uploads/info-task-attachments
app.task-tracking.email-reminders.enabled=false
app.info-task.email-reminders.enabled=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=120MB
server.tomcat.max-swallow-size=-1
